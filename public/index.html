<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCN Sales & Performance Tracker</title>
  <style>
    :root {
      --primary: #1e293b;
      --secondary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #334155;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--primary); font-size: 24px; }

    .status-bar {
      font-size: 14px;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 20px;
      background: #f1f5f9;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .card h3 { margin-top: 0; color: var(--primary); }

    .form-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    input[type="number"], input[type="month"] {
      width: 120px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: center;
      font-size: 14px;
    }

    th { background: var(--primary); color: white; }

    .table-input {
      width: 80%;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: right;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }

    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>MCN Sales Tracker</h1>
    <div>
      <input type="month" id="trackingMonth" value="2026-08" onchange="loadFromLocalStorage()">
      <span id="saveStatus" class="status-bar">Ready</span>
    </div>
  </div>

  <div class="grid-2">
    <!-- Target & Expenses -->
    <div class="card">
      <h3>Targets & Expenses</h3>
      <div class="form-group">
        <label>Sales Quota:</label>
        <input type="number" id="salesQuota" value="208500" oninput="calculate()">
      </div>
      <div class="form-group">
        <label>Manpower Expense:</label>
        <input type="number" id="expManpower" value="51150" oninput="calculate()">
      </div>
      <div class="form-group">
        <label>Rent Expense:</label>
        <input type="number" id="expRent" value="54992" oninput="calculate()">
      </div>
      <div class="form-group">
        <label>Electricity Expense:</label>
        <input type="number" id="expElect" value="0" oninput="calculate()">
      </div>
      <div class="form-group">
        <label>Prizes Expense:</label>
        <input type="number" id="expPrize" value="0" oninput="calculate()">
      </div>
      <div class="form-group">
        <label>PHSI Expense:</label>
        <input type="number" id="expPhsi" value="40000" oninput="calculate()">
      </div>
    </div>

    <!-- Summary Readout -->
    <div class="card">
      <h3>Summary & Performance</h3>
      <p><strong>Total Sales:</strong> <span id="totalSales">₱0.00</span></p>
      <p><strong>Total Expenses:</strong> <span id="totalExpenses">₱0.00</span></p>
      <p><strong>Net Sales:</strong> <span id="netSales">₱0.00</span></p>
      <p><strong>Quota Achievement:</strong> <span id="quotaPercent">0%</span></p>
      <button class="btn" onclick="saveToLocalStorage()">Save Changes to Server</button>
    </div>
  </div>

  <!-- Daily Sales Table -->
  <h3>Daily Sales Log</h3>
  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>UFO Sales</th>
        <th>TC Sales</th>
        <th>Total Day Sales</th>
      </tr>
    </thead>
    <tbody id="salesTableBody">
      <!-- Generated dynamically -->
    </tbody>
  </table>
</div>

<script>
  function setSaveStatus(text, color) {
    const el = document.getElementById('saveStatus');
    el.innerText = text;
    el.style.color = color || '#334155';
  }

  function initTable() {
    const tbody = document.getElementById('salesTableBody');
    tbody.innerHTML = '';
    for (let day = 1; day <= 31; day++) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>Day ${day}</td>
        <td><input type="number" class="table-input ufo-input" data-day="${day}" oninput="calculate()"></td>
        <td><input type="number" class="table-input tc-input" data-day="${day}" oninput="calculate()"></td>
        <td id="dayTotal-${day}">₱0.00</td>
      `;
      tbody.appendChild(tr);
    }
  }

  function calculate() {
    let totalSales = 0;
    for (let day = 1; day <= 31; day++) {
      const ufo = parseFloat(document.querySelector(`.ufo-input[data-day="${day}"]`).value) || 0;
      const tc = parseFloat(document.querySelector(`.tc-input[data-day="${day}"]`).value) || 0;
      const dayTotal = ufo + tc;
      document.getElementById(`dayTotal-${day}`).innerText = '₱' + dayTotal.toLocaleString('en-US', {minimumFractionDigits: 2});
      totalSales += dayTotal;
    }

    const quota = parseFloat(document.getElementById('salesQuota').value) || 0;
    const manpower = parseFloat(document.getElementById('expManpower').value) || 0;
    const rent = parseFloat(document.getElementById('expRent').value) || 0;
    const elect = parseFloat(document.getElementById('expElect').value) || 0;
    const prize = parseFloat(document.getElementById('expPrize').value) || 0;
    const phsi = parseFloat(document.getElementById('expPhsi').value) || 0;

    const totalExpenses = manpower + rent + elect + prize + phsi;
    const netSales = totalSales - totalExpenses;
    const achievement = quota > 0 ? ((totalSales / quota) * 100).toFixed(2) : 0;

    document.getElementById('totalSales').innerText = '₱' + totalSales.toLocaleString('en-US', {minimumFractionDigits: 2});
    document.getElementById('totalExpenses').innerText = '₱' + totalExpenses.toLocaleString('en-US', {minimumFractionDigits: 2});
    document.getElementById('netSales').innerText = '₱' + netSales.toLocaleString('en-US', {minimumFractionDigits: 2});
    document.getElementById('quotaPercent').innerText = achievement + '%';
  }

  async function saveToLocalStorage() {
    const month = document.getElementById('trackingMonth').value || '2026-08';
    const dailySales = {};
    for (let day = 1; day <= 31; day++) {
      const ufoVal = document.querySelector(`.ufo-input[data-day="${day}"]`).value;
      const tcVal = document.querySelector(`.tc-input[data-day="${day}"]`).value;
      dailySales[day] = { ufo: ufoVal, tc: tcVal };
    }

    const storeObj = {
      salesQuota: document.getElementById('salesQuota').value,
      expenses: {
        manpower: document.getElementById('expManpower').value,
        rent: document.getElementById('expRent').value,
        elect: document.getElementById('expElect').value,
        prize: document.getElementById('expPrize').value,
        phsi: document.getElementById('expPhsi').value
      },
      dailySales: dailySales
    };

    setSaveStatus('Saving...', '#d97706');

    try {
      const response = await fetch('/api/sales', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ month, data: storeObj })
      });
      if (response.ok) {
        setSaveStatus('✓ Saved to Server', '#16a34a');
      } else {
        setSaveStatus('Error Saving', '#dc2626');
      }
    } catch (e) {
      setSaveStatus('Network Error', '#dc2626');
    }
  }

  async function loadFromLocalStorage() {
    const month = document.getElementById('trackingMonth').value || '2026-08';
    setSaveStatus('Loading...', '#d97706');

    try {
      const res = await fetch(`/api/sales?month=${month}`);
      const data = await res.json();

      if (data) {
        document.getElementById('salesQuota').value = data.salesQuota ?? 208500;
        if (data.expenses) {
          document.getElementById('expManpower').value = data.expenses.manpower ?? 51150;
          document.getElementById('expRent').value = data.expenses.rent ?? 54992;
          document.getElementById('expElect').value = data.expenses.elect ?? 0;
          document.getElementById('expPrize').value = data.expenses.prize ?? 0;
          document.getElementById('expPhsi').value = data.expenses.phsi ?? 40000;
        }
        if (data.dailySales) {
          for (let day = 1; day <= 31; day++) {
            const ufoEl = document.querySelector(`.ufo-input[data-day="${day}"]`);
            const tcEl = document.querySelector(`.tc-input[data-day="${day}"]`);
            if (data.dailySales[day]) {
              ufoEl.value = data.dailySales[day].ufo;
              tcEl.value = data.dailySales[day].tc;
            } else {
              ufoEl.value = '';
              tcEl.value = '';
            }
          }
        }
      } else {
        document.getElementById('salesQuota').value = 208500;
        document.getElementById('expManpower').value = 51150;
        document.getElementById('expRent').value = 54992;
        document.getElementById('expElect').value = 0;
        document.getElementById('expPrize').value = 0;
        document.getElementById('expPhsi').value = 40000;

        for (let day = 1; day <= 31; day++) {
          const ufoEl = document.querySelector(`.ufo-input[data-day="${day}"]`);
          const tcEl = document.querySelector(`.tc-input[data-day="${day}"]`);
          ufoEl.value = '';
          tcEl.value = '';
        }
      }
      calculate();
      setSaveStatus('✓ Loaded', '#16a34a');
    } catch (e) {
      setSaveStatus('Error Loading', '#dc2626');
    }
  }

  // Initialize App
  initTable();
  loadFromLocalStorage();
</script>

</body>
</html>
